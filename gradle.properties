org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Necessário a partir daqui: a biblioteca de encoding MP3 (TAndroidLame, ver
# app/build.gradle.kts) ainda depende internamente da Android Support
# Library antiga (com.android.support:appcompat-v7) em vez de AndroidX. O
# Jetifier reescreve esses bytecodes automaticamente para AndroidX em tempo
# de build — sem isso, o Gradle recusa misturar as duas bibliotecas no mesmo
# projeto AndroidX.
android.enableJetifier=true
