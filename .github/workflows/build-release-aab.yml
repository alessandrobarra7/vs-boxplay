name: Build signed release AAB and APK

# Produces two signed, NON-debuggable artifacts:
#   - app/build/outputs/bundle/release/app-release.aab  -> upload this to Play Console
#   - app/build/outputs/apk/release/app-release.apk      -> sideload this on phones
#     to test before publishing.
#
# One-time setup before this workflow can build release artifacts:
#   1. Generate an upload keystore on YOUR machine (never share this file, never
#      commit it to git):
#        keytool -genkeypair -v -keystore boxplay-upload.jks -alias boxplay \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. Base64-encode it and copy the output:
#        base64 -w0 boxplay-upload.jks   (Linux)
#        base64 -i boxplay-upload.jks | pbcopy   (macOS)
#   3. In the GitHub repo: Settings > Secrets and variables > Actions > New
#      repository secret. Create these four secrets:
#        RELEASE_KEYSTORE_BASE64  -> the base64 text from step 2
#        RELEASE_STORE_PASSWORD   -> the keystore password you chose
#        RELEASE_KEY_ALIAS        -> boxplay (or whatever alias you used)
#        RELEASE_KEY_PASSWORD     -> the key password you chose
#   4. Keep boxplay-upload.jks somewhere safe outside git.
#
# If any signing secret is missing, this workflow fails before building so it
# does not publish an unsigned or misleading release artifact.
#
# This workflow is manual during the pre-publication phase. The debug workflow
# still runs on pushes to feature branches, while release builds are started
# only after the signing secrets are configured.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed release artifacts"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Run checks and build signed release AAB + APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew check :app:validateReleaseSigning :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload signed AAB (for Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: boxplay-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signed APK (for sideload testing)
        uses: actions/upload-artifact@v4
        with:
          name: boxplay-release-apk
          path: app/build/outputs/apk/release/*.apk